[project]
name = "adnn-irreversibility"
version = "0.1.0"
requires-python = ">=3.10"
description = "Offline reversibility measurement infrastructure and pilot"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
